name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    # Commit com [iphone] no texto atualiza só a versão do iPhone (site): não gera APK nem avisa o Android.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[iphone]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Conferir os arquivos
        run: |
          ls -la
          test -f package.json || { echo "::error::package.json não está na raiz do repositório"; exit 1; }
          test -f www/index.html || { echo "::error::www/index.html não está no repositório"; exit 1; }

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund

      - name: Embutir a fonte do jogo (funciona sem internet)
        continue-on-error: true
        timeout-minutes: 2
        run: npm run fonte

      - name: Criar o projeto Android
        run: npx cap add android

      - name: Ícone da Peta e tela de abertura
        run: |
          if [ -d recursos/android/res ]; then cp -r recursos/android/res/. android/app/src/main/res/
          else echo "::warning::Pasta recursos não encontrada; o app vai usar o ícone padrão."; fi

      - name: Número da versão (sobe sozinho a cada envio)
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          VER=$(grep -oP "const VERSAO = '\K[^']+" www/index.html || echo 1.0)
          sed -i "s/versionName \"1.0\"/versionName \"$VER\"/" android/app/build.gradle
          echo "Versão do app: $VER"

      - name: Tela cheia e pausa ao minimizar
        run: |
          if [ -f recursos/android/java/MainActivity.java ]; then
            cp recursos/android/java/MainActivity.java android/app/src/main/java/com/patrulhadosbigodes/app/MainActivity.java
          fi

      - name: Deixar o jogo sempre em pé (retrato)
        run: sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Endereço do repositório para o aviso de atualização
        run: sed -i "s#__REPO_GITHUB__#${{ github.repository }}#" www/index.html

      - name: Copiar o jogo para o app
        run: npx cap sync android

      - name: Usar sempre a mesma assinatura (para atualizar sem perder o progresso)
        env:
          APP_KEYSTORE: ${{ secrets.APP_KEYSTORE }}
        run: |
          if [ -z "$APP_KEYSTORE" ]; then echo "::error::Falta o segredo APP_KEYSTORE (Settings > Secrets and variables > Actions)"; exit 1; fi
          echo "$APP_KEYSTORE" | tr -d ' \r\n' | base64 -d > "$HOME/chave-app.keystore"
          cat >> android/app/build.gradle <<GRADLE

          android {
              signingConfigs {
                  chaveFixa {
                      storeFile file("$HOME/chave-app.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.chaveFixa }
              }
          }
          GRADLE

      - name: Montar o APK
        working-directory: android
        timeout-minutes: 25
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renomear e conferir a assinatura
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PatrulhaDosBigodes.apk
          AS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          "$AS" verify --print-certs PatrulhaDosBigodes.apk | grep -i "SHA-256" || true

      - name: Disponibilizar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: PatrulhaDosBigodes-APK
          path: PatrulhaDosBigodes.apk

      - name: Publicar a versão (o app avisa quem tem versão antiga)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP "const VERSAO = '\K[^']+" www/index.html || echo 1.0)
          NOTAS=$(git log -1 --pretty=%s)
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" PatrulhaDosBigodes.apk --clobber
            gh release edit "v$VER" --notes "$NOTAS"
          else
            gh release create "v$VER" PatrulhaDosBigodes.apk --title "Versão $VER" --notes "$NOTAS" --latest
          fi
