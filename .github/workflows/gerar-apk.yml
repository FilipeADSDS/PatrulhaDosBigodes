name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Conferir os arquivos
        run: |
          ls -la
          test -f package.json || { echo "::error::package.json não está na raiz do repositório"; exit 1; }
          test -f www/index.html || { echo "::error::www/index.html não está no repositório"; exit 1; }

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund

      - name: Embutir a fonte do jogo (funciona sem internet)
        continue-on-error: true
        timeout-minutes: 2
        run: npm run fonte

      - name: Criar o projeto Android
        run: npx cap add android

      - name: Ícone da Peta e tela de abertura
        run: |
          if [ -d recursos/android/res ]; then cp -r recursos/android/res/. android/app/src/main/res/
          else echo "::warning::Pasta recursos não encontrada; o app vai usar o ícone padrão."; fi

      - name: Número da versão (sobe sozinho a cada envio)
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          VER=$(grep -oP "const VERSAO = '\K[^']+" www/index.html || echo 1.0)
          sed -i "s/versionName \"1.0\"/versionName \"$VER\"/" android/app/build.gradle
          echo "Versão do app: $VER"

      - name: Tela cheia e pausa ao minimizar
        run: |
          if [ -f recursos/android/java/MainActivity.java ]; then
            cp recursos/android/java/MainActivity.java android/app/src/main/java/com/patrulhadosbigodes/app/MainActivity.java
          fi

      - name: Deixar o jogo sempre em pé (retrato)
        run: sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Copiar o jogo para o app
        run: npx cap sync android

      - name: Usar sempre a mesma assinatura (para atualizar sem perder o progresso)
        run: |
          mkdir -p ~/.android
          cp ferramentas/debug.keystore ~/.android/debug.keystore
          if [ -n "$ANDROID_USER_HOME" ]; then mkdir -p "$ANDROID_USER_HOME"; cp ferramentas/debug.keystore "$ANDROID_USER_HOME/debug.keystore"; fi

      - name: Montar o APK
        working-directory: android
        timeout-minutes: 25
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PatrulhaDosBigodes.apk

      - name: Disponibilizar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: PatrulhaDosBigodes-APK
          path: PatrulhaDosBigodes.apk
